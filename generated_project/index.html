<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" class="display" readonly aria-label="Calculator display">
        <div class="buttons">
            <!-- Row 1 -->
            <button type="button" class="calc-btn" data-value="7" aria-label="Seven">7</button>
            <button type="button" class="calc-btn" data-value="8" aria-label="Eight">8</button>
            <button type="button" class="calc-btn" data-value="9" aria-label="Nine">9</button>
            <button type="button" class="calc-btn" data-value="/" aria-label="Divide">/</button>
            <!-- Row 2 -->
            <button type="button" class="calc-btn" data-value="4" aria-label="Four">4</button>
            <button type="button" class="calc-btn" data-value="5" aria-label="Five">5</button>
            <button type="button" class="calc-btn" data-value="6" aria-label="Six">6</button>
            <button type="button" class="calc-btn" data-value="*" aria-label="Multiply">*</button>
            <!-- Row 3 -->
            <button type="button" class="calc-btn" data-value="1" aria-label="One">1</button>
            <button type="button" class="calc-btn" data-value="2" aria-label="Two">2</button>
            <button type="button" class="calc-btn" data-value="3" aria-label="Three">3</button>
            <button type="button" class="calc-btn" data-value="-" aria-label="Subtract">-</button>
            <!-- Row 4 -->
            <button type="button" class="calc-btn" data-value="0" aria-label="Zero">0</button>
            <button type="button" class="calc-btn" data-value="." aria-label="Decimal point">.</button>
            <button type="button" class="calc-btn" data-value="C" aria-label="Clear">C</button>
            <button type="button" class="calc-btn" data-value="+" aria-label="Add">+</button>
            <!-- Row 5 -->
            <button type="button" class="calc-btn" data-value="←" aria-label="Backspace">←</button>
            <button type="button" class="calc-btn" data-value="=" aria-label="Equals">=</button>
        </div>
    </div>
</body>
</html>
