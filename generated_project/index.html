<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Simple Calculator</h1>
    <form id="calc-form" onsubmit="return false;">
        <input type="number" id="num1" placeholder="First number" required>
        <input type="number" id="num2" placeholder="Second number" required>
        <br>
        <button type="button" id="add">+</button>
        <button type="button" id="subtract">-</button>
        <button type="button" id="multiply">*</button>
        <button type="button" id="divide">/</button>
        <button type="button" id="clear">Clear</button>
    </form>
    <div id="result"></div>
</body>
</html>
